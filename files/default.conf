server {
    listen       8080;
    server_name  {{ .Values.ingress.host }};
    root         /usr/share/nginx/html;

    #access_log  /var/log/nginx/host.access.log  main;

    # ---- reverse-proxy / ingress awareness ---------------------------------

    # Never emit absolute Location headers. This pod is reached through an
    # ingress that terminates TLS on a public host/port different from this
    # container's internal http/8080 — an absolute redirect would leak that
    # internal detail and silently downgrade https -> http for the client.
    absolute_redirect off;

    # Trust X-Forwarded-For from the cluster network so $remote_addr (and
    # therefore access logs) reflect the real client IP behind the ingress,
    # not the ingress controller's own pod IP. Adjust the CIDR(s) to your
    # actual ingress-controller / pod network range for tighter trust.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Don't advertise the exact nginx version to the internet.
    server_tokens off;

    # ---- compression --------------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ---- static assets: long-lived, immutable cache -------------------------
    # Angular's build hashes these filenames (main-XXXX.js, styles-XXXX.css),
    # so a new deploy always ships new filenames — safe to cache forever.

    location ~* \.(?:js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ---- app shell / prerendered pages ---------------------------------------
    # try_files serves each route's prerendered index.html directly (internal
    # rewrite, no client-visible redirect) for the 5 statically-generated
    # routes. Anything else (e.g. /reviews, which renders client-side only
    # since its data is live/per-request) falls back to index.csr.html — a
    # route-agnostic shell with no baked-in hydration state. Falling back to
    # a specific route's index.html instead would ship that route's
    # server-rendered DOM/state under the wrong URL, which Angular's
    # hydration would detect as a mismatch and force a full client re-render
    # (a flash of the wrong page). index.html itself must never be cached so
    # new deploys are picked up immediately.

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.csr.html;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
