# nginx's add_header does NOT merge across nesting levels — a location that
# defines its own add_header silently drops any inherited from the server
# block. So rather than declaring these once at server level, every location
# that also sets its own add_header (e.g. Cache-Control) includes this file
# explicitly to keep them.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
